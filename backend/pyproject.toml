[project]
name = "backend"
version = "0.1.0"
description = "Vértice Retail - Motor de Priorização de Margem (Módulo C)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.35",
    "pydantic>=2.9.0",
    "pandas>=2.2.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-litellm>=0.7.0",
    "litellm>=1.70.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
backend = "backend.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
